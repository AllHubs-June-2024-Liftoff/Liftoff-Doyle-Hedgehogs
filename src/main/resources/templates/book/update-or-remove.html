<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
   <meta charset="UTF-8">
   <title>Little Online Library</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
   <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body class="container">
<div>
<h2 th:text="${title}"></h2>

<h4 th:text="'Current visibility: ' + ${currentHasBookStatus}"></h4>
</div>
<div>
<h3>What would you like to do?</h3>

<p>
   <span th:if="${errorMessage}" th:text="${errorMessage}" th:style="'color: red'">Error</span>
</p>

<form th:object="${bookshelfVolume}" method="post" th:action="@{/book/update-or-remove/ + ${id}}">
      <input type="hidden" name="id" th:value="${id}"/>
      <p th:each="updateOption : ${updateOptions}">
         <span>
            <input
                    type="radio"
                    name="updateOption"
                    th:id="${updateOption.key}"
                    th:value="${updateOption.key}">
            <label th:for="${updateOption.key}" th:text="${updateOption.value}"></label>
         </span>
      </p>
      <input type="submit" class="btn btn-success" th:href="@{'/book/update-or-remove/'}">
</form>
</div>
<hr>
<a type="button" class="btn btn-warning" th:href="@{'/bookshelf/view/' + ${bookshelfVolume.bookshelf.user.username}}">Cancel</a>

</body>
</html>

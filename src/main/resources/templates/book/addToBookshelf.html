<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
   <meta charset="UTF-8">
   <title>Little Online Library</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
   <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body class="container">
<h1 th:text="${title}"></h1>
<form th:object="${bookshelfVolume}" th:action="@{/book/addToBookshelf}" method="post">
   <table>
      <tr>
         <td><img th:src="@{${thumbnail}}" class="img-thumbnail"></td>
      </tr>
      <tr>
         <td>Title</td>
         <td th:text="${bookTitle}"></td>
      </tr>
      <tr>
         <td>Author(s)</td>
         <td th:text="${author}"></td>
      </tr>
      <tr>
         <td>Description</td>
         <td th:text="${description}"></td>
      </tr>
      <tr>
         <td>Add tags</td>
         <td>
               <div class="form-group">
<!--                  <input type="hidden" th:field="${bookshelfVolumeTag.bookshelfVolume}" th:value="${bookshelfVolume}">-->
                  <th:block th:each="tag : ${allTags}">
                     <input th:field="${bookshelfVolumeTag.tags}" type="checkbox" name="tag" th:value="${tag.id}" >
                     <label th:text="${tag.displayName}"></label>
                     <br>
                  </th:block>
               </div>
         </td>
      </tr>
      <tr>
         <td>List in the Library?</td>
         <td>
            <input type="radio" id="yes" default name="has_book" value="true" checked>
            <label for="yes">Yes</label>
            <input type="radio" id="no" name="has_book" value="false">
            <label for="no">Not yet</label>
         </td>
      </tr>
   </table>
   <div>
      <input type="hidden" th:id="bookId" th:value="${bookId}">
      <input type="hidden" th:id="title" th:value="${bookTitle}">
      <input type="hidden" th:id="author" th:value="${author}">
      <input type="hidden" th:id="description" th:value="${description}">
      <input type="hidden" th:id="thumbnail" th:value="${thumbnail}">
      <input type="hidden" th:id="bookshelfId" th:value="${bookshelfId}">
   </div>
   <div class="form-group">
      <input type="submit" value="Done" class="btn btn-success"/>
   </div>
</form>


</body>
</html>

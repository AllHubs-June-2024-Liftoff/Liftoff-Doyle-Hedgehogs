<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
   <meta charset="UTF-8">
   <title>Little Online Library</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
   <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body class="container">
<div>
<h1 th:text="${title}"></h1>
</div>
<div>
<form th:object="${bookshelfVolume}" th:action="@{/book/addToBookshelf}" method="post">

    <img th:src="@{${thumbnail}}" class="img-thumbnail">
   <br>
   <p th:text="${author}"></p>
   <p th:text="${bookTitle}"></p>
   <p th:text="${description}">-</p>
   <br>
         <label>Add tags (optional):
               <div class="grid-container-tags">
                  <block class="grid-item" th:each="tag : ${allTags}">
                     <input th:field="${bookshelfVolumeTag.tags}" type="checkbox" name="tag" th:value="${tag.id}" >
                     <label th:text="${tag.displayName}"></label>
                     <input type="hidden" th:field="${bookshelfVolumeTag.bookshelfVolume}" th:value="${bookshelfVolume}">
                  </block>
               </div>
         </label>
      <input type="hidden" th:id="bookId" th:value="${bookId}">
      <input type="hidden" th:id="title" th:value="${bookTitle}">
      <input type="hidden" th:id="author" th:value="${author}">
      <input type="hidden" th:id="description" th:value="${description}">
      <input type="hidden" th:id="thumbnail" th:value="${thumbnail}">
      <input type="hidden" th:id="bookshelfId" th:value="${bookshelfId}">
   <br>
      <input type="submit" value="Done" class="btn btn-success"/>
</form>
</div>
<p><a href="../user/index">Return to Profile Page</a></p>
</body>
</html>

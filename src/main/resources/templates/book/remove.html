<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Little Online Library</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body class="container">

<h2 th:text="${title}"></h2>

<h3>What would you like to do?</h3>

<form method="post">
    <div class="form-group">
        <input type="radio" name="remove" value="transfer" id="transfer">
        <label>Transfer to another user</label>
    </div>
    <div class="form-group">
        <input type="radio" name="remove" value="hide" id="hide">
        <label>Mark unavailable but keep on my bookshelf (will not show up in searches)</label>
    </div>
    <div class="form-group">
        <input type="radio" name="remove" value="delete" id="delete">
        <label>Remove from Little Online Library entirely</label>
    </div>
    <div>
        <a type="button" class="btn btn-warning" th:href="@{'/bookshelf/view/' + ${bookshelfVolume.bookshelf.user.username}}">Cancel</a>
        <input type="submit" class="btn btn-success">
    </div>
</form>

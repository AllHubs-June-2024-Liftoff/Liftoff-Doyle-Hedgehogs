<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
   <meta charset="UTF-8">
   <title>Little Online Library</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
   <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body>

<h1 th:text="${title}"></h1>
<div th:replace="~{frags/navbar :: navbar}"></div>
<form method="post" >
   <div class="form-group">
      <input type="hidden" th:field="${bookshelfVolumeTag.bookshelfVolume}">
      <th:block th:each="tag : ${allTags}">
         <input th:field="${bookshelfVolumeTag.tags}" type="checkbox" name="tag" th:value="${tag.id}" >
         <label th:text="${tag.displayName}"></label>
         <br>
      </th:block>
   </div>
   <div class="form-group">
      <input type="submit" value="Done" class="btn btn-success"/>
   </div>
<!--   <button class="btn btn-success" th:href="@{/bookshelf/view/} + ${username}">Back to Bookshelf</button>-->
</form>

</body>
</html>

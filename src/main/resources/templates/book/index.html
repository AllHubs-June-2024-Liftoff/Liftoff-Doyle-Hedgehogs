<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
   <meta charset="UTF-8">
   <title>Little Online Library</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
   <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body class="container">

<h1>All Books</h1>
<div th:replace="~{frags/navbar :: navbar}"></div>
<table class="table table-striped">

   <tr>
      <th>Title</th>
      <th>Author</th>
      <th>Tags</th>
      <th>Bookshelf</th>
   </tr>

   <tr th:each="bookshelfVolume : ${bookshelfVolumes}">
      <td th:text="${bookshelfVolume.volume.title}"></td>
      <td th:text="${bookshelfVolume.volume.author}"></td>
      <td>
         <div th:each="tag : ${bookshelfVolume.tags}">
                <span>
                    <a th:href="@{'/tags/' + ${tag.id}}" th:text="${tag.displayName}"></a>
                </span>
         </div>
      </td>
      <td>
         <a th:href="@{'/bookshelf/' + ${bookshelfVolume.bookshelf.id}}" th:text="${bookshelfVolume.bookshelf.bookshelf_name}"></a>
      </td>
   </tr>

</table>

</body>
</html>

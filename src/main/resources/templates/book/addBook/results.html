<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <link th:href="@{/styles.css}" rel="stylesheet">
    <title> Little Online Library</title>
</head>


<body>
<div>
    <h1>Little Online Library</h1>
</div>
<div>
    <h2 th:text="${title}"></h2>
</div>
<div>
<form th:action="@{/book/api/results}" method="post">
    <input type="hidden" th:id="bookshelfId" th:value="${bookshelfId}">
    <label for="searchTerm">Search by Title, Author, or ISBN:</label>
    <input type="text" name="searchTerm" id="searchTerm" placeholder="Search">
    <button type="submit">Search</button>
</form>
</div>
<div class="grid-container" style="grid-auto-flow: row;">
    <div class="grid-item" th:each="volume: ${searchResults}">
        <form th:action="@{/book/api/results/selected}" method="post">
            <input type="hidden" name="bookId" th:value="${volume.id}">
            <input type="hidden" name="bookTitle" th:value="${volume.title}">
            <input type="hidden" name="author" th:value="${volume.author}">
            <input type="hidden" name="description" th:value="${volume.description}">
            <input type="hidden" name="thumbnail" th:value="${volume.thumbnail}">
            <button type="submit">
                <img th:src="@{${volume.thumbnail}}" class="img-thumbnail">
            </button>
            <p class="grid-item-text" th:text="${volume.title}"></p>
            <p class="grid-item-text" th:text="${volume.author}"></p>
        </form>
    </div>
</div>

<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <link th:href="@{/styles.css}" rel="stylesheet">
    <title> Little Online Library</title>
</head>


<body>
<h1 th:text="${title}"></h1>
<form th:action="@{/book/api/results}" method="post">
    <label for="searchTerm">Search by Title, Author, or ISBN:</label>
    <input type="text" name="searchTerm" id="searchTerm" placeholder="Search">
    <button type="submit">Search</button>
</form>

<table>
    <tr th:each="volume: ${searchResults}">
        <td>
            <form th:action="@{/book/api/results/selected}" method="post">
                <input type="hidden" name="bookId" id="bookId" th:value="${volume.id}">
                <input type="hidden" name="bookTitle" id="bookTitle" th:value="${volume.title}">
                <input type="hidden" name="author" id="author" th:value="${volume.author}">
                <input type="hidden" name="description" id="description" th:value="${volume.description}">
                <input type="hidden" name="thumbnail" id="thumbnail" th:value="${volume.thumbnail}">
                <button type="submit">
                    <img th:src="@{${volume.thumbnail}}" class="img-thumbnail">
                </button>
            </form>
        </td>
        <td th:text="${volume.author}"></td>
        <td th:text="${volume.title}"></td>

    </tr>
</table>

</body>


</html>

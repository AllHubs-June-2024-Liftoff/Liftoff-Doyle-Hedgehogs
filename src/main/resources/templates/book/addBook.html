<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
  <link th:href="@{/styles.css}" rel="stylesheet">
  <title> Little Online Library</title>
</head>


<body>
<h1 th:text="${title}"></h1>
<form th:action="@{/addBook/results}" method="post">
  <label for="searchTerm">Search by Title, Author, or ISBN:</label>
  <input type="text" name="searchTerm" id="searchTerm" placeholder="Search">
</form>

<table>
    <tr th:each="volume: ${searchResults}">
      <td><img th:src="${volume.thumbnail}" class="img-thumbnail"></td>
        <td th:text="${volume.title}"></td>
        <td th:text="${volume.author}"></td>
    </tr>
</table>

</body>


</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Little Online Library</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body>

<h1 th:text="${title}">Default Heading</h1>

<table class="table table-striped">
    <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Tags</th>
        <th>Rating</th>
    </tr>

    <tr th:each="bookshelfVolume : ${bookshelfVolumes}">
        <td th:text="${bookshelfVolume.volume.title}"></td>
        <td th:text="${bookshelfVolume.volume.author}"></td>
        <td>
            <div th:each="tag : ${bookshelfVolume.tags}">
                <span>
                    <a th:href="@{'/tags/' + ${tag.id}}" th:text="${tag.displayName}"></a>
                </span>
            </div>
        </td>
        <td>
            <form th:action="@{/book/rate}" method="post">
                <input type = "hidden" name="id" th:value="${bookshelfVolume.id}" />
                <select name = "rating" class = "form-select-sm">
                    <option value = "" th:selected="${bookshelfVolume.rating == null}">No Rating</option>
                    <option value = "1" th:selected="${bookshelfVolume.rating == 1}">1</option>
                    <option value = "2" th:selected="${bookshelfVolume.rating == 2}">2</option>
                    <option value = "3" th:selected="${bookshelfVolume.rating == 3}">3</option>
                    <option value = "4" th:selected="${bookshelfVolume.rating == 4}">4</option>
                    <option value = "5" th:selected="${bookshelfVolume.rating == 5}">4</option>
        </td>
    </tr>


</table>


</body>
</html>

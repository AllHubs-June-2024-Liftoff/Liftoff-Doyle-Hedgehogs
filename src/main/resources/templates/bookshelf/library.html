<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Little Online Library</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body>
<div>
    <h1 th:text="${title}"></h1>
</div>
<form th:action="@{/book/addBook}" method="post">
    <input type="hidden" th:id="bookshelfId" th:value="${bookshelfId}">
    <a type="button" class="btn btn-success" th:href="@{'/book/addBook'}">Add a Book</a>
</form>

<table class="table table-striped">
    <thead>
    <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Tags</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="bookshelfVolume : ${bookshelfVolumes}">
        <td th:text="${bookshelfVolume.volume.title}"></td>
        <td th:text="${bookshelfVolume.volume.author}"></td>
        <td>
            <p th:each="tag : ${bookshelfVolume.tags}">
                    <a th:href="@{'/tags/' + ${tag.id}}" th:text="${tag.displayName}"></a>
            </p>
        </td>
        <td>
            <p>

                    <a th:href="'/book/update-or-remove/' + ${bookshelfVolume.id}" th:text="${updateRemoveButtonLabel}"></a>

            </p>
        </td>
        <td>
            <div th:unless="${bookshelfVolume.pendingTransferTo == null}">
                Requested
            </div>
        </td>
    </tr>
    </tbody>
</table>

<p><a href="../../user/index">Return to Profile Page</a></p>

</body>
</html>

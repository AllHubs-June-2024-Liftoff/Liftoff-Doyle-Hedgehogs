<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Little Online Library</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body>

<h1>Little Online Library</h1>

<h2>Request Book</h2>
<form th:action="@{/user/email}" method="post">
    <div>
        <label> Your Contact Email
            <input th:field="${userEmailDTO.email}" type="email"/>
        </label>
    </div>
    <p>*Little Online Library will send an automated message to book owner with your contact information.</p>
    <input type="hidden" name="recipient" th:value="${recipient}">
    <input type="hidden" name="bookTitle" th:value="${bookTitle}"/>
    <input type="hidden" name="bookId" th:value="${bookId}">
    <input type="hidden" name="requestingUsername" th:value="${requestingUsername}">

    <input type="submit" class="btn btn-primary" value="Email Owner" />
<!--    <p th:text="${success}"></p>-->
    <p><a href="../search">Continue Searching for Books</a></p>
</form>

</body>
</html>

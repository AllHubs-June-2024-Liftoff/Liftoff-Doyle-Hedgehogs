<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org/">
<head></head>
<body class="container">

<header>Register</header>

<form method="post">
    <div>
        <label>Username
            <input th:field="${registerFormDTO.username}" />
        </label>
        <p th:errors="${registerFormDTO.username}"></p>
    </div>
    <div>
        <label>Email
            <input th:field="${registerFormDTO.email}" type="email" />
        </label>
    </div>
    <div>Location
        <div>
            <input type="radio" id="kansascity" value="0" th:field="${registerFormDTO.location}">
            <label for="kansascity">Kansas City</label><br>
            <input type="radio" id="philadelphia" value="1" th:field="${registerFormDTO.location}">
            <label for="philadelphia">Philadelphia</label><br>
            <input type="radio" id="saintlouis" value="2" th:field="${registerFormDTO.location}">
            <label for="saintlouis">Saint Louis</label>
        </div>
    </div>
    <div>
        <label>Password
            <input th:field="${registerFormDTO.password}" type="password" />
        </label>
        <p th:errors="${registerFormDTO.password}"></p>
    </div>
    <div>
        <label>Verify Password
            <input th:field="${registerFormDTO.verifyPassword}" type="password" />
        </label>
    </div>

    <input type="submit" class="btn btn-primary" value="Register" />
</form>

</body>
</html>

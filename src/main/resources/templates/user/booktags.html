<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Little Online Library</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body>

<h1 th:text="${title}"></h1>
<form method="post" th:action="@{/user/booktags/} + ${bookshelfVolumeId}">
    <h3>Edit current tags:</h3>
    <div class="form-group">
    <ul>
        <li th:each="tag : ${currentTags}">
            <input th:type="checkbox" checked th:text="${tag.displayName}">
        </li>
    </ul>
    </div>
<hr />
    <h3>Add tags:</h3>
    <div class="form-group">
    <ul>
        <li th:each="tag : ${notCurrentTags}">
            <input th:type="checkbox" th:text="${tag.displayName}">
        </li>
    </ul>
    </div>
    <div class="form-group">
        <input type="submit" value="Finished" class="btn btn-success"/>
    </div>
</form>

</body>
</html>

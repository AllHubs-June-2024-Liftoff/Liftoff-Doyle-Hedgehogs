<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Little Online Library</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body>
<p>Dummy text; user view of individual bookshelfVolume details to add/remove tags</p>

<h1 th:text="${title}"></h1>

<h3>Current tags:</h3>
<ul>
    <li th:each="tag : ${currentTags}">
        <input th:type="checkbox" checked th:text="${tag.displayName}">
    </li>
</ul>
<hr />
<h3>All tags:</h3>
<ul>
    <li th:each="tag : ${allTags}">
        <input th:type="checkbox" th:text="${tag.displayName}">
    </li>
</ul>

<ul>

</ul>

</body>
</html>

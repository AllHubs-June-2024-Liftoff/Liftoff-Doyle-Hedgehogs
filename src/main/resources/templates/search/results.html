<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Little Online Library</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body class="container">
<div>
    <h1 th:text="${title}"></h1>
</div>
<div>
<form th:action="@{/search/redirectToResults}" method="post">
    <p>
        <span th:if="${errorMessage}" th:text="${errorMessage}" th:style="'color: red'">Error</span>
    </p>
    <p>
        <span th:each="location : ${locations}">
            <input
                    type="radio"
                    name="location"
                    th:id="${location.key}"
                    th:value="${location.value}">
                <label th:for="${location.key}" th:text="${location.value}"></label>
        </span>
    </p>
    <p>
      <span th:each="column : ${columns}">
                <input
                        type="radio"
                        name="searchType"
                        th:id="${column.key}"
                        th:value="${column.key}"/>
                <label th:for="${column.key}" th:text="${column.value}"></label>
      </span>
    </p>

    <p>
        <label for="searchTerm">Search Term:</label>
        <input type="text" name="searchTerm" id="searchTerm" placeholder="Search">
    </p>

        <input type="submit" value="Search" class="btn btn-success">

</form>

<p style="margin-top: 5px">Or</p>
<a th:href="@{'/tags'}">
    <button>Search by Tags</button>
</a>
</div>
<hr />
<div>
<h2 th:text="${pageTitle}" style="text-align center"></h2>
<table class="table table-striped">
<tbody>
    <tr>
        <th>Title</th>
        <th>Author(s)</th>
        <th>Tags</th>
        <th>Bookshelf</th>
        <th>Contact Owner</th>
    </tr>

    <tr th:each="bookshelfVolume : ${bookshelfVolumes}">

        <td th:text="${bookshelfVolume.volume.title}"></td>
        <td th:text="${bookshelfVolume.volume.author}"></td>
        <td>
            <p th:each="tag : ${bookshelfVolume.tags}">
                    <a th:href="@{'/tags/' + ${tag.id}}" th:text="${tag.displayName}"></a>
            </p>
        </td>
        <td>
            <a th:href="@{'/bookshelf/' + ${bookshelfVolume.bookshelf.id}}" th:text="${bookshelfVolume.bookshelf.bookshelf_name}"></a>
        </td>
        <td>
            <form method="post" th:action="@{/search/redirectToRequestEmailForm}">
                    <input type="hidden" name="recipient" th:value="${bookshelfVolume.bookshelf.user.email}"/>
                    <input type="hidden" name="bookTitle" th:value="${bookshelfVolume.volume.title}"/>
                    <input type="hidden" name="bookId" th:value="${bookshelfVolume.id}">
                    <input type="hidden" name="requestingUsername" th:value="${requestingUsername}">
                <input type="submit" class="btn btn-primary" value="Request Book" />
            </form>
        </td>
    </tr>
</tbody>
</table>
</div>

<p><a href="../user/index">Return to Profile Page</a></p>

</body>
</html>

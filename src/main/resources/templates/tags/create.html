<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
   <title>Little Online Library</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
   <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body>

<h1>Create a Tag</h1>
<p>
   Note: Tags may include lowercase letters and numbers. Other characters will be automatically changed to lowercase or removed when the tag is submitted.
</p>
<form method="post">
   <div class="block">
      <label>New Tag
         <input th:field="${tag.name}" class="form-control" placeholder="#newtag">
      </label>
   </div>
   <input type="submit" value="Submit" class="btn btn-success">
</form>

</body>
</html>
